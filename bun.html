 <style>

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    width: 100%;
    }
 
 body{
background: #383838;
background: linear-gradient(182deg, rgba(56, 56, 56, 1) 0%, rgba(0, 0, 0, 1) 100%);
padding: 10px;
}

@media screen and (max-width: 800px){
    body{
        padding-top: 25%;
    }
}

/* Регистрируем кастомное свойство, чтобы браузер понял, как его анимировать */
@property --gradient-color {
  syntax: '<color>';
  initial-value: rgba(56, 56, 56, 1);
  inherits: false;
}

body {
  /* Важно задать min-height, чтобы градиент растянулся на весь экран, а не повторялся */
  min-height: 100vh; 
  margin: 0;

  /* Подставляем нашу переменную вместо статичного серого цвета */
  background: #383838;
  background: linear-gradient(182deg, var(--gradient-color) 0%, rgba(0, 0, 0, 1) 100%);
  
  /* Запускаем анимацию: имя, длительность (8 секунд), бесконечно, плавно туда-обратно */
  animation: colorShift 8s ease-in-out infinite alternate;
}

/* Описываем саму анимацию */
@keyframes colorShift {
  0% {
    --gradient-color: rgba(56, 56, 56, 1); /* Исходный серый */
  }
  100% {
    --gradient-color: rgb(121, 0, 0); /* Темно-красный (DarkRed) */
  }
}
 
.block{
    min-width: 300px;
    max-width: 350px;
    height: 280px;
    margin: auto;
    margin-top: 5%;
    background-color: rgb(99, 99, 99);
    border-radius: 10px;
    text-align: center;
    font-family: 'Jura', sans-serif;
    font-size: 20px;
    opacity: 0.75;
    font-weight: bold;
    padding: 5px;
}

button{
    width: 250px;
    height: 35px;
    border-radius: 10px;
    background-color: rgb(87, 104, 255);
    margin-top: 30px;
}
 </style>
